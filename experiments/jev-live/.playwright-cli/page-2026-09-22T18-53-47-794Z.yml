                - heading [level=2] [ref=e1575]: Win Conditions
                - paragraph [ref=e913]: The win condition is simple- whoever has the greatest number of coins at the end of the season is the winner. It is also possible that the two players will tie.
                - heading [level=2] [ref=e1576]: Reward
                - paragraph [ref=e915]: The player who has the most money in the bank at the end of the game wins. Unsold items in the inventory do not count towards that total.
                - heading [level=2] [ref=e1577]: Observation Format
                - paragraph [ref=e917]: "The top-level observation passed to each agent:"
                - code [ref=e919]: "{ \"player\": int, # 0 or 1 \"day\": int, # 0-indexed in-game day \"hour\": int, # 0-indexed turn within the day \"farms\": [farm, farm], # public per-player state, indexed by player id (shared) \"market\": { # shared \"inventory\": { \"WHEAT\": int, \"CARROT\": int, ... }, \"prices\": { \"WHEAT\": int, \"CARROT\": int, ... }, }, \"town\": { # shared \"unlocked_shops\": [\"BAKERY\", \"BAKERY\", ...], # may repeat; each entry consumes independently }, \"private\": { # this player only; opponent's private state is not visible \"shed\": { \"WHEAT\": int, \"GOOSE\": int, \"FERTILIZER\": int, ... }, \"seeds\": { \"WHEAT\": int, \"CARROT\": int, ... }, \"inventories\": [farmer_inv, hand_inv, ...], # [0] is the main farmer }, }"
                - paragraph [ref=e920]:
                  - text: Each
                  - code [ref=e921]: farm
                  - text: "dict (public, visible to both players):"
                - code [ref=e923]: "{ \"money\": float, \"tiles\": [[tile, ...], ...], # tiles[y][x] \"farmer\": [x, y], \"hands\": [[x, y], ...], # hired hands for the current day \"unlocked_quadrants\": [\"NW\", ...], # subset of {\"NW\",\"NE\",\"SW\",\"SE\"} \"hires_today\": int, # used to price the next HIRE }"
