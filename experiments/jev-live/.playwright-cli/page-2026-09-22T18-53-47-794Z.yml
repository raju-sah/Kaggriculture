              - generic [ref=e211]:
                - paragraph [ref=e212]: This simulation competition is a turn-based farming game where two players compete on separate farms to see who can earn the most profit by the end of a 30-day season (720 turns).
                - paragraph [ref=e213]: "Your agent acts as the main farmer and can strategically hire farm hands to scale up operations. To succeed, your agent must:"
                - list [ref=e214]:
                  - listitem [ref=e215]: Plant, water, fertilize, and harvest a variety of crops.
                  - listitem [ref=e216]: Buy, feed, and care for animals to produce eggs, milk, and wool.
                  - listitem [ref=e217]: Collect and utilize fertilizer to boost crop yields.
                  - listitem [ref=e218]: Buy neighboring quadrants of land to expand your farm's footprint.
                  - listitem [ref=e219]: Trade smart on a dynamic market where prices react to your sales and town demand.
                - paragraph [ref=e220]: Kaggriculture represents a highly complex environment that models the exact same dynamics found in real-world supply chains, dynamic market pricing, and industrial resource allocation under uncertainty. Underlying mechanics like scheduling resources, optimizing labor, adjusting to supply/demand price changes, and making long-horizon capital investments, serve as a high-fidelity sandbox for training AI to solve complex enterprise operations.
                - paragraph [ref=e221]
            - generic [ref=e223]:
              - generic [ref=e224] [cursor=pointer]:
