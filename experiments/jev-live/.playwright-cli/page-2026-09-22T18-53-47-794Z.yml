              - generic [ref=e1117]:
                - paragraph [ref=e1118]: "Below is a simple starter agent implementing a basic wheat loop:"
                - code [ref=e1120]: "def agent(obs): player = obs[\"player\"] me = obs[\"farms\"][player] private = obs[\"private\"] fx, fy = me[\"farmer\"] tile = me[\"tiles\"][fy][fx] market = [] # Buy a wheat seed if we have none and have enough money if private[\"seeds\"].get(\"WHEAT\", 0) == 0 and me[\"money\"] >= 10: market.append([\"BUY_SEED\", \"WHEAT\", 1]) # Sell any wheat sitting in the shed wheat_in_shed = private[\"shed\"].get(\"WHEAT\", 0) if wheat_in_shed > 0: market.append([\"SELL\", \"WHEAT\", wheat_in_shed]) # If standing on an empty tile, plant wheat if tile is None and private[\"seeds\"].get(\"WHEAT\", 0) > 0: return {\"farmer\": [\"PLANT\", \"WHEAT\"], \"hands\": [], \"market\": market} # If standing on a plant, manage watering and harvesting if isinstance(tile, dict) and tile.get(\"kind\") == \"PLANT\": crop_age = obs[\"day\"] - tile[\"planted_day\"] if crop_age >= 2: # Wheat first_yield_day = 2 return {\"farmer\": [\"HARVEST\"], \"hands\": [], \"market\": market} if not tile[\"watered_today\"]: return {\"farmer\": [\"WATER\"], \"hands\": [], \"market\": market} return {\"farmer\": [\"PASS\"], \"hands\": [], \"market\": market}"
