                - heading [level=2] [ref=e1578]: Quick Start
                - code [ref=e942]: "from kaggle_environments import make def my_agent(obs): # Buy one wheat seed on the very first turn, then PASS forever after. if obs.get(\"step\", 0) == 0: return {\"farmer\": [\"PASS\"], \"market\": [[\"BUY_SEED\", \"WHEAT\", 1]]} return {\"farmer\": [\"PASS\"], \"market\": []} env = make(\"kaggriculture\", configuration={\"episodeSteps\": 200}) env.run([my_agent, \"random\"]) env.render(mode=\"ipython\", width=800, height=800)"
