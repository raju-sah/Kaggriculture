                - heading [level=2] [ref=e1450]: Market Mechanics
                - paragraph [ref=e673]: The market has an unlimited supply of seeds and animals at fixed prices. Sell prices, however, move dynamically per resource and persist across days.
                - paragraph [ref=e674]:
                  - text: Every product (and fertilizer) starts the game with a market inventory of
                  - code [ref=e675]: I0 = 10,000
                  - text: units, far above any single game's realistic production volume so that inventory is essentially guaranteed to stay positive. The sell price for a product is
                  - code [ref=e676]: base
                  - text: at
                  - code [ref=e677]: I0
                  - text: ", rises as inventory falls (players buying or town consumption draining supply), and falls as inventory grows (players selling)."
                - heading [level=3] [ref=e1451]: Selling inventory to the market
                - paragraph [ref=e679]:
                  - text: Players can queue any number of sell or buy orders (for any quantity) in the market action list. Orders are processed concurrently across players, one unit at a time. For example, when both players issue
                  - code [ref=e680]: SELL CARROT 10
                  - text: first, we take the current carrot price, give both players that price for their first carrot, then add 2 carrots to the market (1 from each player) — which may shift the price — and repeat until both orders complete.
                - paragraph [ref=e681]:
                  - text: If the sell price has been driven down to
                  - code [ref=e682]: $1
                  - text: (the price floor), the unit is still purchased but is
                  - emphasis [ref=e683]: not
                  - text: added to market inventory, so the floor remains responsive to subsequent buys.
                - heading [level=3] [ref=e1452]: Buying inventory from the market
                - paragraph [ref=e685]:
                  - text: Only
                  - code [ref=e686]: WHEAT
                  - text: and
                  - code [ref=e687]: FERTILIZER
                  - text: can be bought from the market via
                  - code [ref=e688]: BUY_PRODUCT
                  - text: "(other products are sold at the market but not bought back). Selling is unrestricted: every product, including fertilizer collected from animals, can be sold via"
                  - code [ref=e689]: SELL
                  - text: ". Two things drain market inventory: town buildings (town center and shops, which consume products for free) and player"
                  - code [ref=e690]: BUY_PRODUCT
                  - text: orders. Buy orders follow the same one-unit-at-a-time concurrent procedure as sell orders. If a player runs out of money mid-order, the order is stopped.
                - paragraph [ref=e691]: The buy price is quoted at the post-buy inventory and the sell price is quoted at the pre-sell inventory, so an immediate buy followed by a sell of the same item against an otherwise-unchanged market nets exactly zero.
                - heading [level=3] [ref=e1453]: The Price Function
                - paragraph [ref=e693]:
                  - text: For each resource the curve is defined by a base price, an anchor throughput
                  - code [ref=e694]: T
                  - text: ", and an independent"
                  - strong [ref=e695]: shape function
                  - text: +
                  - strong [ref=e696]: target move
                  - text: "for each side of the equilibrium:"
                - code [ref=e698]: "price(inv) = base + sign · amp · f(|inv − I0|) sign = +1 if inv < I0 (scarcity → price up) sign = −1 if inv > I0 (glut → price down) amp = target · base / f(T) (derived; not stored) f ∈ { linear, sq, sqrt, log, log10, hinge } (log uses ln(1+x), so f(0)=0)"
                - paragraph [ref=e699]:
                  - text: Floored at
                  - code [ref=e700]: $1
                  - text: and rounded to the nearest dollar.
                - paragraph [ref=e701]:
                  - code [ref=e702]: hinge
                  - text: is the one shape that depends on
                  - code [ref=e703]: T
                  - text: rather than on
                  - code [ref=e704]: x
                  - text: "alone: with"
                  - code [ref=e705]: u = x / T
                  - text: it evaluates to
                  - code [ref=e706]: u + 8 · max(0, u − 1)²
                  - text: . Below
                  - code [ref=e707]: T
                  - text: it is linear in
                  - code [ref=e708]: u
                  - text: ; above
                  - code [ref=e709]: T
                  - text: the quadratic term takes over and the price climbs steeply. Since
                  - code [ref=e710]: f(T) = 1
                  - text: by construction,
                  - code [ref=e711]: target
                  - text: keeps its usual meaning.
                - paragraph [ref=e712]:
                  - code [ref=e713]: T
                  - text: "is the production capacity of a single 5×5 field over a 24-day window at optimal watering with no fertilizer (animal totals are pre-discounted by 30% to account for wheat-feed overhead, and allow one day to build the coop or pasture). The 24-day window is a calibration horizon, not the 30-day season length. It is shorter on purpose: the opening days are setup-heavy and yield little."
                - paragraph [ref=e714]:
                  - code [ref=e715]: target
                  - text: says "moving
                  - code [ref=e716]: T
                  - text: units past
                  - code [ref=e717]: I0
                  - text: shifts the price by
                  - code [ref=e718]: target × base
                  - text: ." Picking different
                  - code [ref=e719]: f
                  - text: and
                  - code [ref=e720]: target
                  - text: "on each side lets resources with similar production profiles play very differently strategically — wheat panics on scarcity but absorbs gluts; melon barely reacts to scarcity but crashes hard on overproduction; wool mirrors melon at a smaller scale. Premium resources (base > $100: strawberry, melon, milk, wool) use"
                  - code [ref=e721]: above_target > 1
                  - text: ", so even modest gluts drive them straight to the $1 floor — bundling and timing sales matters more for these than for staples."
