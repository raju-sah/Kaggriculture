                - paragraph [ref=e442]:
                  - text: For crops, "Yield / tile / day" is total units harvested divided by the days the tile is occupied, watering daily and harvesting at peak yield. For animals it is the steady-state production rate (
                  - code [ref=e443]: 1 / interval
                  - text: ) once the first yield lands; animals keep producing for as long as they are fed, so there is no fixed occupancy to divide by. "Max Yield" for animals is
                  - code [ref=e444]: max_held
                  - text: ", the cap on"
                  - emphasis [ref=e445]: unharvested
                  - text: product sitting on the tile, not a lifetime total.
                - paragraph [ref=e446]: "Crop \"Time to Max Yield\" is the age at which yield stops increasing under daily watering, which is not always the end of the bonus window:"
                - list [ref=e447]:
                  - listitem [ref=e448]:
                    - strong [ref=e449]: Melon
                    - text: "'s bonus window is ages 6–12, but base 1 plus one unit per watered day reaches the cap of 6 at age 10, so ages 11–12 add nothing. Fertilizing reaches the cap at age 8."
                  - listitem [ref=e450]:
                    - strong [ref=e451]: Wheat
                    - text: and
                    - strong [ref=e452]: Carrot
                    - text: only reach their listed Max Yield of 6 and 4 with fertilizer; watering alone peaks at 4 and 3.
                  - listitem [ref=e453]:
                    - strong [ref=e454]: Tomato
                    - text: and
                    - strong [ref=e455]: Strawberry
                    - text: are ongoing but
                    - emphasis [ref=e456]: not
                    - text: "indefinite: production is capped at 4 scheduled yields (tomato at ages 8–11, strawberry at ages 10, 12, 14, 16), after which the plant decays into a weed."
                - paragraph [ref=e457]: All plants must be watered every day. They will turn into weeds if they are not watered for two successive days. All animals must be fed every day using wheat. They will escape and be unrecoverable if they are not fed for two successive days. Wheat is also available to buy at the market and can be purchased at the current market price.
                - heading [level=2] [ref=e1404]: Actions
                - paragraph [ref=e459]: Each turn, the player may take one action. There are 24 turns per day, and 30 days in the season - 720 total turns.
                - heading [level=3] [ref=e1405]: Farmer / Farm Hand Action
                - paragraph [ref=e461]: Each Farmer / Farm Hand can be given an action every turn. Farmer/Farm Hand CAN occupy the same space.
                - heading [level=4] [ref=e1406]: Movement
                - list [ref=e463]:
                  - listitem [ref=e464]:
                    - text: "NORTH, SOUTH, EAST, WEST — Move one cell in that direction. Moves off the edge of the board are no-ops. Locked tiles are passable: a unit may move onto and across unbought quadrants, but tile actions ("
                    - code [ref=e465]: PLANT
                    - text: ","
                    - code [ref=e466]: WATER
                    - text: ","
                    - code [ref=e467]: BUILD_*
                    - text: ", etc.) all no-op on a locked tile and consume nothing. The exception is the shed actions"
                    - code [ref=e468]: PICKUP
                    - text: ","
                    - code [ref=e469]: DROP
                    - text: ", and"
                    - code [ref=e470]: PLACE
                    - text: "-into-shed, which work from any shed-access tile even while that tile is locked — they use the tile only as a standing position and never change it."
                - heading [level=4] [ref=e1407]: Shed
                - paragraph [ref=e472]: Picks up an item from the shed (must be orthogonally adjacent) into the inventory
                - list [ref=e473]:
                  - listitem [ref=e474]:
                    - text: PICKUP
                    - code [ref=e475]: <item>
                    - code [ref=e476]: "[n]"
                    - text: — move up to
                    - code [ref=e477]: "n"
                    - text: of
                    - code [ref=e478]: <item>
                    - text: (default 1) from the shed into the active farmer/hand's inventory. Any item present in the shed is valid (animals, fertilizer, harvested produce, etc.). Seeds live in a separate slot and are never picked up —
                    - code [ref=e479]: PLANT
                    - text: consumes them directly.
                  - listitem [ref=e480]:
                    - text: DROP — orthogonally adjacent to the shed, dump the active farmer/hand's entire current inventory into the shed. Overflow past
                    - code [ref=e481]: shedCapacity
                    - text: is discarded. No-op if not shed-adjacent.
                - heading [level=4] [ref=e1408]: Plants
                - list [ref=e483]:
                  - listitem [ref=e484]:
                    - text: PLANT — Plant a seed purchased from the market
                    - list [ref=e485]:
                      - listitem [ref=e486]: Seeds are automatically available to all Farmers / Farm Hands
                      - listitem [ref=e487]: If you try to plant too many in a specific turn, none are planted
                      - listitem [ref=e488]: ie if you have 1 melon seed, but two units do the PLANT MELON command
                  - listitem [ref=e489]: WATER — Water a plant. This only needs to be done once per day, and subsequent waterings on the same day are a no-op.
                  - listitem [ref=e490]: HARVEST — Gather produce from a plant. If the plant does not have subsequent yields, it will be removed from the map. Each harvest action will yield at least one unit of the crop, with the potential of additional yield depending on watering and fertilizer (the formula differs by crop type — see harvest yields below). Harvested items are added to the inventory.
                  - listitem [ref=e491]:
                    - text: FERTILIZE — Fertilize a plant to increase its potential yield (see harvest yields below).
                    - list [ref=e492]:
                      - listitem [ref=e493]: Doubles the per-day yield bonus for the next 3 days. The bonus only applies on days the plant is also watered (basic needs first).
                - heading [level=4] [ref=e1409]: Animals
                - list [ref=e495]:
                  - listitem [ref=e496]:
                    - text: PLACE
                    - code [ref=e497]: <item>
                    - code [ref=e498]: "[n]"
                    - text: "— Drop items from the active farmer/hand inventory into either a tile or the shed:"
                    - list [ref=e499]:
                      - listitem [ref=e500]:
                        - strong [ref=e501]: Animal placement
                        - text: ": standing on a matching unoccupied structure ("
                        - code [ref=e502]: GOOSE
                        - text: on a coop,
                        - code [ref=e503]: SHEEP
                        - text: /
                        - code [ref=e504]: COW
                        - text: on a pasture) places one animal from inventory onto the tile. The
                        - code [ref=e505]: "n"
                        - text: argument is ignored.
                      - listitem [ref=e506]:
                        - strong [ref=e507]: Shed drop
                        - text: ": standing orthogonally adjacent to the shed moves up to"
                        - code [ref=e508]: "n"
                        - text: (default 1) of
                        - code [ref=e509]: <item>
                        - text: from inventory into the shed. Capped by
                        - code [ref=e510]: shedCapacity
                        - text: ; excess stays in inventory.
                  - listitem [ref=e511]: FEED — Feed an animal using wheat (only needs to be done once per day)
                  - listitem [ref=e512]: HARVEST — Collect the eggs/milk/wool produced by the animal.
                  - listitem [ref=e513]: COLLECT_FERTILIZER — Collect 1 fertilizer from the animal. Every surviving animal makes 1 available at the end of each day, whether or not it was fed or cared for. Uncollected fertilizer does not accumulate, so an animal left alone for five days still yields 1 unit.
                  - listitem [ref=e514]: CARE — Care for an animal (once per day, no-op if already cared for). See animal care below.
                - heading [level=4] [ref=e1410]: Animal Care
                - paragraph [ref=e516]: "CARE banks a yield bonus that is paid out on the animal's next scheduled production:"
                - list [ref=e517]:
                  - listitem [ref=e518]:
                    - text: At end of day, if the animal was both fed AND cared for that day,
                    - code [ref=e519]: pending_care_bonus
                    - text: increments by 1. Days where the animal was unfed do not bank a bonus (basic needs first).
                  - listitem [ref=e520]: On a scheduled production day, if the animal is fed, the entire banked bonus is added to that production's yield (in addition to the base 1) and the bank resets to 0.
                  - listitem [ref=e521]: If the animal is unfed on the production day, the base 1 unit is still produced, but the banked bonus is not applied and the bank resets to 0.
                  - listitem [ref=e522]:
                    - code [ref=e523]: pending_care_bonus
                    - text: is capped indirectly by the per-animal
                    - code [ref=e524]: max_held
                    - text: cap on
                    - code [ref=e525]: yield_units
                    - text: .
                - heading [level=4] [ref=e1411]: Terrain
                - list [ref=e527]:
                  - listitem [ref=e528]: BUILD_COOP - adds a coop to an unoccupied tile
                  - listitem [ref=e529]: BUILD_PASTURE - add pasture to an unoccupied tile
                  - listitem [ref=e530]:
                    - text: DIG — Remove a plant from a square to free up space OR remove a weed from a square (does not yield any produce) OR remove an
                    - strong [ref=e531]: empty
                    - text: goose coop / pasture. A coop or pasture with an animal on it cannot be dug; the DIG is a no-op.
                - heading [level=4] [ref=e1412]: Other
                - list [ref=e533]:
                  - listitem [ref=e534]: PASS — Default if there is nothing to do (optional)
                - heading [level=3] [ref=e1413]: Market Action
                - paragraph [ref=e536]:
                  - text: Each turn you can submit up to
                  - code [ref=e537]: maxMarketOrdersPerTurn
                  - text: (default 10) market actions; any orders past that limit are silently dropped. This is an ordered list and market orders will be processed in order simultaneously (one from each player) while both players have orders.
                - list [ref=e538]:
                  - listitem [ref=e539]:
                    - text: BUY_SEED — Purchase N units of a single item from the market.
                    - list [ref=e540]:
                      - listitem [ref=e541]: BUY_SEED WHEAT 1
                  - listitem [ref=e542]:
                    - text: BUY_ANIMAL -
                    - list [ref=e543]:
                      - listitem [ref=e544]: BUY_ANIMAL GOOSE 1
                  - listitem [ref=e545]:
                    - text: BUY_PRODUCT
                    - list [ref=e546]:
                      - listitem [ref=e547]: BUY_PRODUCT WHEAT 1
                      - listitem [ref=e548]: BUY_PRODUCT FERTILIZER 1
                  - listitem [ref=e549]:
                    - text: SELL — Sell N units of a single item to the market.
                    - list [ref=e550]:
                      - listitem [ref=e551]: SELL WHEAT 1
                  - listitem [ref=e552]: HIRE — Hire a farm hand for the day. Cost increases for each extra hand hired on the same day.
                  - listitem [ref=e553]:
                    - text: BUY_LAND - unlock a new 5x5 segment of land to plant on. Increasing in cost.
                    - list [ref=e554]:
                      - listitem [ref=e555]: "Costs are: $1k, $2k, $4k"
                - heading [level=2] [ref=e1414]: Watering / Animal Feed
                - paragraph [ref=e557]: Plants (and animals) must be watered/fed a minimum of every other day. Watering only needs to be done once per day, and subsequent watering actions are a no-op. In the case of plants not watered for two consecutive days, at the end of the day they turn into a WEED. In the case of animals they escape (unrecoverable).
                - paragraph [ref=e558]:
                  - text: A new seed starts with
                  - code [ref=e559]: consecutive_unwatered = 1
                  - text: — the planting day itself counts as the first missed day. A seed planted and left unwatered that same day reaches 2 at the end-of-day refresh and becomes a weed that night, before it grows. There is no grace period for fresh plantings.
                - paragraph [ref=e560]:
                  - text: A newly placed animal starts with
                  - code [ref=e561]: consecutive_unfed = 0
                  - text: ", so it survives its first day unfed."
                - paragraph [ref=e562]: Note that watering one-time yield plants during their yield window results in a higher yield. This is NOT true for ongoing yield plants/animals. See below.
                - heading [level=2] [ref=e1415]: Harvest Yields
                - paragraph [ref=e564]: Plants will potentially have higher yields based on how well they have been cared for.
                - list [ref=e565]:
                  - listitem [ref=e566]:
                    - strong [ref=e567]: One-time crops
                    - text: "(wheat, carrot, melon): Starting at half the plant's"
                    - code [ref=e568]: max_yield_day
                    - text: (Time to Max Yield) rounded up, watering during the bonus window will add one unit per day to the total harvestable yield.
                    - list [ref=e569]:
                      - listitem [ref=e570]: Fertilized plants add 2 per day instead.
                  - listitem [ref=e571]:
                    - strong [ref=e572]: Ongoing crops
                    - text: "(tomato, strawberry): Scheduled production happens at fixed intervals. The base yield is 1 per scheduled production. If the plant is fertilized AND watered that day, yield is doubled to 2."
                  - listitem [ref=e573]:
                    - text: Once a plant has hit its maximum lifespan, the total yield available on the plant will reduce by 1 every other turn until it hits 0, at which point the plant becomes a weed.
                    - list [ref=e574]:
                      - listitem [ref=e575]:
                        - strong [ref=e576]: One-time crops
                        - text: reach max lifespan one day after
                        - code [ref=e577]: max_yield_day
                        - text: .
                      - listitem [ref=e578]:
                        - strong [ref=e579]: Ongoing crops
                        - text: start decay one day after their cumulative production count reaches
                        - code [ref=e580]: max_yield
                        - text: (i.e. they've fired enough scheduled productions to hit the cap, regardless of whether the produce has been harvested).
                - heading [level=2] [ref=e1416]: Map Features
                - paragraph [ref=e582]: Each player has their own farm with a set number of squares. Players are unable to see the state of the other’s shed, but can see the state of their opponent’s farm.
                - heading [level=3] [ref=e1417]: Farm Space
                - list [ref=e584]:
                  - listitem [ref=e585]:
                    - text: The land near your farm is a
                    - code [ref=e586]: boardSize
                    - text: ×
                    - code [ref=e587]: boardSize
                    - text: grid (default 10×10), divided into four 5×5 quadrants. At first, your farm covers one quadrant (25% of the squares). For an increasingly large fee, you can buy the neighboring quadrants and eventually cover 100% of the squares.
                  - listitem [ref=e588]: Each plant or animal occupies one square on the farm.
                  - listitem [ref=e589]: Players can allocate these squares however they choose between crops and livestock. There are no specific limits per type.
                  - listitem [ref=e590]: Weeds have a chance of spawning on any empty cells on the farm, and must be cleared before the land can be used for other purposes.
                  - listitem [ref=e591]: Squares on the farm can be either a plant, a coop/pasture, a weed, or empty.
                - heading [level=3] [ref=e1418]: Shed (Inventory)
                - list [ref=e593]:
                  - listitem [ref=e594]: Functions as an inventory for items that are harvested but not yet sold, or for seeds that have not yet been planted
                  - listitem [ref=e595]: Farmer and hired farm hands will spawn at the shed at the start of each day
                  - listitem [ref=e596]: Farmer and hired farm hands drop their inventory at the end of the day in the shed (if there is room)
                  - listitem [ref=e597]:
                    - text: Limited to 100 items, excluding seeds. Once the shed is full, any further items added (via
                    - code [ref=e598]: PLACE
                    - text: mid-day or end-of-day inventory drop) are discarded — there is no overflow holding area, so stockpiling on farmer/hand inventories does not bypass the cap.
                - paragraph [ref=e599]:
                  - text: The shed sits at the center of the board and is not a tile — it never appears in the
                  - code [ref=e600]: tiles
                  - text: array, whose only values are
                  - code [ref=e601]: None
                  - text: ","
                  - code [ref=e602]: "\"LOCKED\""
                  - text: ", and structure dicts. \"Orthogonally adjacent to the shed\" means standing on one of the four center tiles,"
                  - code [ref=e603]: (half-1, half-1)
                  - text: ","
                  - code [ref=e604]: (half, half-1)
                  - text: ","
                  - code [ref=e605]: (half-1, half)
                  - text: ","
                  - code [ref=e606]: (half, half)
                  - text: for
                  - code [ref=e607]: half = boardSize // 2
                  - text: . At the default
                  - code [ref=e608]: boardSize = 10
                  - text: those are
                  - code [ref=e609]: (4,4)
                  - text: ","
                  - code [ref=e610]: (5,4)
                  - text: ","
                  - code [ref=e611]: (4,5)
                  - text: ", and"
                  - code [ref=e612]: (5,5)
                  - text: ", one in each quadrant. Since only NW starts unlocked, three of those four tiles begin locked; the shed is reachable from all of them regardless, because the shed itself is never locked."
                - heading [level=3] [ref=e1419]: Farmer/Farm Hand
                - heading [level=4] [ref=e1420]: Hiring
                - list [ref=e615]:
                  - listitem [ref=e616]:
                    - text: Hiring is a market order (
                    - code [ref=e617]: HIRE
                    - text: ). It costs more every time you want to hire an additional hand each day. At the end of the day all, hands drop inventory at the farm and disappear (need to be re-hired each day)
                  - listitem [ref=e618]:
                    - text: Cost is
                    - code [ref=e619]: farmHandCostMult * fib(n)
                    - text: where
                    - code [ref=e620]: "n"
                    - text: is the number of hires already made today (fib starts 1, 1, 2, 3, 5, 8, 13, …).
                    - list [ref=e621]:
                      - listitem [ref=e622]:
                        - text: With the default
                        - code [ref=e623]: farmHandCostMult = 1
                        - text: ": 1, 1, 2, 3, 5, 8, 13, 21, etc… (resets at the start of each day)"
                  - listitem [ref=e624]: A hired hand appears orthogonally adjacent to the shed in a free space following NWSE. If there are not open spaces, it looks for the one with the least occupants, breaking ties by NWSE preference
                  - listitem [ref=e625]:
                    - text: Spawn placement ignores whether the tile is locked. Since the main farmer starts on
                    - code [ref=e626]: (4,4)
                    - text: ", the least-occupied rule sends the first hire of each day to"
                    - code [ref=e627]: (5,4)
                    - text: ", which is locked until the NE quadrant is bought. Locked tiles are passable, so a hand spawned on one can move back to unlocked land."
                - heading [level=4] [ref=e1421]: Inventory
                - list [ref=e629]:
                  - listitem [ref=e630]: When harvesting or picking items up, they are added to inventory.
                  - listitem [ref=e631]: Can drop items in the shed
                  - listitem [ref=e632]: At the end of the day, all items in all inventory will be added to shed inventory (if there is room). Anything that doesn't fit is discarded — overflow is lost.
                - heading [level=3] [ref=e1422]: Town Buildings
                - paragraph [ref=e634]:
                  - text: As the season progresses, new shops unlock at regular intervals (every
                  - code [ref=e635]: townShopUnlockInterval
                  - text: days, default 3). Each unlock is drawn uniformly at random
                  - strong [ref=e636]: with replacement
                  - text: from the full shop table, so the same shop can unlock more than once — a season might end up with three bakeries and no yarn store. Once unlocked, a shop stays active for the rest of the game, and unlocking stops after 8 total instances. Total demand grows monotonically as more shops unlock.
                - paragraph [ref=e637]:
                  - text: Each unlocked shop
                  - emphasis [ref=e638]: instance
                  - text: consumes one of every product it demands every
                  - code [ref=e639]: townShopSellInterval
                  - text: turns (default 4). So with the default interval, a shop demanding wheat removes 6 wheat from the market per day, and two copies of that shop remove 12. Single-product shops consume 2x.
                - paragraph [ref=e640]:
                  - text: In addition, the town center consumes one of every product (excluding fertilizer) every
                  - code [ref=e641]: townCenterSellInterval
                  - text: turns (default 24, i.e. once per day). This rate is flat for the whole season — it does not ramp.
