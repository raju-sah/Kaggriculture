            - generic [ref=e254]:
              - generic [ref=e255] [cursor=pointer]:
                - generic [ref=e257]:
                  - heading [level=3] [ref=e1284]: Evaluation
                  - button [ref=e1285]: link
                - button [expanded] [ref=e1286]: keyboard_arrow_up
              - generic [ref=e265]:
                - paragraph [ref=e266]: Each day your team is able to submit up to 5 agents (bots) to the competition. Each submission will play Episodes (games) against other bots on the ladder that have a similar skill rating. Over time, skill ratings will go up with wins or down with losses, and even out with ties. To reduce the number of bots playing and ensure high-quality matching, only the latest 2 submissions are tracked. The latest 2 submissions are also used for final leaderboard evaluation.
                - paragraph [ref=e267]: Every bot submitted will continue to play episodes until the end of the competition, with newer bots playing a much more frequent number of episodes. On the leaderboard, only your best-scoring bot will be shown, but you can track the progress of all of your submissions on your Submissions page.
                - paragraph [ref=e268]:
                  - text: When you upload a submission, a
                  - strong [ref=e269]: Validation Episode
                  - text: is run where your agent plays against a copy of itself to ensure it runs without errors. If the episode fails, the submission is marked as
                  - code [ref=e270]: Error
                  - text: ", and you can download the agent logs to debug. Otherwise, the submission is initialized with a default rating and joins the matchmaking pool."
                - heading [level=2] [ref=e1287]: Ranking System
                - paragraph [ref=e272]: "Each submission is assigned a skill rating. When your agent plays an episode against an opponent:"
                - list [ref=e273]:
                  - listitem [ref=e274]: Winning the match (having the most coins in the bank at the end of 720 turns) increases your skill rating, while losing decreases it.
                  - listitem [ref=e275]: The amount your rating changes depends on the rating difference between you and your opponent. Beating a highly-rated agent will boost your rating more than beating a lower-rated one.
                  - listitem [ref=e276]: Ties will generally pull ratings closer together.
                  - listitem [ref=e277]: The actual coin difference in a match does not affect the rating change—only the win, loss, or tie outcome matters.
                - heading [level=3] [ref=e1288]: Final Evaluation
                - paragraph [ref=e279]: At the submission deadline, additional submissions will be locked. Games will continue to run for approximately two weeks to continue to reduce uncertainty, especially for new agents. A final Bradley-Terry tournament will be run on those episodes to produce the final leaderboard.
